[package]
name = "toolbar-keys"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Keyboard toolbar model for Wawona terminals. Layout and key bytes, not a platform view."
repository = "https://github.com/Wawona/ToolbarKeys"
rust-version = "1.75"

[lib]
name = "toolbar_keys"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uniffi = "0.28"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }
